<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国Q战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2a1a0c;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(200,160,80,0.10) 0%, transparent 60%),
      linear-gradient(180deg, #3a2a18 0%, #1a0e04 100%);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    font-family: "Microsoft YaHei","SimHei","KaiTi",sans-serif;
  }

  .main { display: flex; align-items: flex-start; gap: 8px; }

  .center-col { text-align: center; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px; margin-bottom: 4px;
  }
  .top-bar .title { color: #d4a840; font-size: 15px; font-weight: bold; letter-spacing: 3px; }
  .top-bar .online { color: #b8a878; font-size: 11px; background: rgba(0,0,0,0.2); padding: 3px 10px; border: 1px solid #5a4a28; border-radius: 10px; }
  .top-bar .online b { color: #8bc34a; }

  .frame {
    padding: 3px;
    background: linear-gradient(180deg, #4a3820 0%, #2a1a0c 100%);
    border: 1px solid #5a3a14; border-radius: 3px;
  }
  .game-wrap { width: 770px; height: 500px; }
  .game-wrap object, .game-wrap embed { width: 770px; height: 500px; }

  .bottom-bar {
    display: flex; justify-content: center; gap: 20px;
    margin-top: 6px; padding: 3px 0;
    color: #7a5a30; font-size: 11px;
  }
  .bottom-bar .sep { color: #4a3010; }

  /* 右侧玩家列表 */
  .players-panel {
    width: 130px; background: rgba(10,5,2,0.85);
    border: 1px solid #4a3010; border-radius: 4px;
    padding: 8px; margin-top: 28px;
    max-height: 520px; overflow-y: auto;
  }
  .players-panel h3 {
    color: #c8a84e; font-size: 12px; text-align: center;
    margin-bottom: 6px; padding-bottom: 4px;
    border-bottom: 1px solid #3a2010;
  }
  .players-panel .player {
    color: #a09070; font-size: 11px; padding: 2px 0;
    border-bottom: 1px solid rgba(74,48,16,0.3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .players-panel .player .lv { color: #8a7a50; margin-right: 4px; }
  .players-panel .empty { color: #555; font-size: 10px; text-align: center; padding: 10px 0; }
</style>
</head>
<body>

<div class="main">
  <div class="center-col">
    <div class="top-bar">
      <span class="title">三 国 Q 战</span>
      <span class="online">⚔ 在线 <b id="oc">--</b> 人</span>
    </div>
    <div class="frame">
      <div class="game-wrap">
        <object classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" width="770" height="500"
                codebase="https://fpdownload.adobe.com/pub/shockwave/cabs/flash/swflash.cab">
          <param name="movie" value="/client/sanguo_web.swf?v=1781094057277">
          <param name="quality" value="high">
          <param name="allowScriptAccess" value="always">
          <param name="flashvars" value="isWeb=1">
          <embed name="flashGame" src="/client/sanguo_web.swf?v=1781094057277" width="770" height="500"
                 quality="high" allowScriptAccess="always"
                 flashvars="isWeb=1"
                 type="application/x-shockwave-flash"
                 pluginspage="https://www.adobe.com/go/getflashplayer">
        </object>
      </div>
    </div>
    <div class="bottom-bar">
      <span>招募武将 · 排兵布阵</span><span class="sep">|</span>
      <span>挑战关卡 · 擂台争霸</span><span class="sep">|</span>
      <span>sanguoqzhan.xyz</span>
    </div>
  </div>

  <!-- 右侧在线玩家列表 -->
  <div class="players-panel" id="playersPanel">
    <h3>在线玩家</h3>
    <div class="empty">加载中...</div>
  </div>
</div>

<script>
function updateOnline(){
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/online-count',true);
  xhr.onload=function(){try{var d=JSON.parse(xhr.responseText);if(d.count!==undefined)document.getElementById('oc').textContent=d.count}catch(e){}};
  xhr.send('{}');
}
function updatePlayers(){
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/online-players',true);
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      var html='<h3>在线玩家 ('+d.players.length+')</h3>';
      if(d.players&&d.players.length>0){
        for(var i=0;i<d.players.length;i++){
          var p=d.players[i];
          html+='<div class=player><span class=lv>Lv.'+p.level+'</span>'+p.name+'</div>';
        }
      }else{html+='<div class=empty>暂无玩家</div>'}
      document.getElementById('playersPanel').innerHTML=html;
    }catch(e){}
  };
  xhr.send('{}');
}
updateOnline();
updatePlayers();
setInterval(updateOnline,30000);
setInterval(updatePlayers,15000);

// 账号缓存：通过Flash变量传递给游戏
(function(){
  var saved=localStorage.getItem('sanguo_user');
  var flashEl=document.getElementById('flashGame')||document.querySelector('embed[name=flashGame]');
  if(saved&&flashEl){
    var parts=saved.split(':');
    if(parts.length>=2){
      flashEl.setAttribute('flashvars','isWeb=1&savedUser='+encodeURIComponent(parts[0])+'&savedPass='+encodeURIComponent(parts[1]));
    }
  }
})();
// 监听Flash登录成功消息
window._sgqzOnLogin=function(uid,pwd){
  localStorage.setItem('sanguo_user',uid+':'+pwd);
};
</script>

</body>
</html>
