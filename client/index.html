<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三国Q战 · 联网版</title><style>
*{box-sizing:border-box}body{margin:0;background:#17120e;color:#ebd7aa;font:15px "Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(100%,1000px);padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:24px;letter-spacing:4px}small,#status{color:#b7a17a}#game{width:100%;aspect-ratio:770/500;background:#090807;border:1px solid #72572d;border-radius:8px;overflow:hidden}ruffle-player{display:block;width:100%;height:100%}footer{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px}button{background:none;border:1px solid #72572d;border-radius:5px;color:#ebd7aa;padding:6px 14px;cursor:pointer}a{color:#e2bf79}#status{line-height:1.7;max-width:750px} @media(max-width:600px){main{padding:12px}header{align-items:start}h1{font-size:20px}footer{flex-wrap:wrap}}
</style></head><body><main><header><div><h1>三国 Q 战</h1><small>联网版 · v4.9.1（历史网页模式）</small></div><span>在线 <b id="online">—</b> 人</span></header><div id="game"></div><footer><span id="status">正在加载游戏，首次打开需要下载资源，请稍候…</span><button id="fullscreen" type="button">全屏</button></footer></main>
<script>window.RufflePlayer={config:{publicPath:'/client/ruffle/',autoplay:'on',unmuteOverlay:'visible',allowScriptAccess:true,backgroundColor:'#17120e',letterbox:'on',warnOnUnsupportedContent:false}};</script>
<script src="/client/ruffle/ruffle.js"></script>
<script>
(async function(){const status=document.getElementById('status');try{const player=window.RufflePlayer.newest().createPlayer();document.getElementById('game').appendChild(player);await player.ruffle().load({url:'/client/sanguo_web.swf?v=web-fixed-20260923',parameters:{isWeb:'1'},base:'/client/'});status.textContent='使用游戏内账号登录或注册，与桌面版共用服务器。';document.getElementById('fullscreen').onclick=()=>document.getElementById('game').requestFullscreen().catch(()=>{});}catch(e){status.textContent='游戏加载失败，请刷新页面重试。';console.error(e)}})();
async function online(){try{const r=await fetch('/api/online-count',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json();document.getElementById('online').textContent=data.count??'—'}catch{document.getElementById('online').textContent='—'}}online();setInterval(online,30000);
window._sgqzOnLogin=function(){};
</script></body></html>
